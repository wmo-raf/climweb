services:
  climweb_db_dev:
    image: postgis/postgis:${POSTGRES_VERSION:-15}-master

  climweb_redis_dev:
    image: redis:alpine

  climweb_dev:
    image: climweb_dev
    container_name: climweb_dev
    restart: no
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        - UID=${UID}
        - GID=${GID}
    ports:
      - "${CLIMWEB_DEV_PORT:-8000}:8000"
    volumes:
      - ./climweb:/climweb/web

  climweb_celery_worker_dev:
    image: climweb_dev
    container_name: climweb_celery_worker_dev
    command: celery-worker
    volumes:
      - ./climweb:/climweb/web

  climweb_celery_beat_dev:
    image: climweb_dev
    container_name: climweb_celery_beat_dev
    restart: no
    command: celery-beat
    volumes:
      - ./climweb:/climweb/web

  # Read-only Docker API for the admin log viewer (Settings -> Server logs).
  # Mirrors the production sidecar in climweb-docker so the feature can be
  # exercised locally. Nothing is published to the host.
  climweb_docker_proxy_dev:
    image: tecnativa/docker-socket-proxy:v0.4.2
    container_name: climweb_docker_proxy_dev
    restart: no
    environment:
      CONTAINERS: 1
      LOGS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - 2375